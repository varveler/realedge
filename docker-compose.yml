version: '3.8'
services:
    backend:
        build: 
            context: ./backend/
            dockerfile: Dockerfile
        container_name: re_backend
        hostname: re_backend
        command: 'python manage.py runserver 0.0.0.0:8000'
        ports: 
            - 8000:8000
        volumes:
            - ./backend:/backend
        env_file: ./backend/.env
        depends_on: 
            - db
    db:
        image: postgres:9.5
        container_name: re_db
        hostname: re_db
        env_file: ./devops/docker/db/.env
        volumes:
            - db_data:/var/lib/postgresql/
            - ./docker/backups/dumps/:/dumps/
volumes:
    db_data:

version: '3.8'
services:
  hydro:
    build:
      context: ./backend
      dockerfile: Dockerfile-test
    entrypoint: ["/tini", "--"]
    volumes:
      - ./backend/:/backend/
    command:  ["python3", "manage.py", "shell_plus", "--notebook"] #["jupyter-notebook", "--allow-root", "--no-browser",  "--ip=0.0.0.0", "--port=8888"]
    ports:
      - 8888:8888
    links:
      - db
    env_file: ./backend/.env
    depends_on:
      - db
      - selenium-hub
    networks:
      - djangonetwork
    #tty: true
